name: Build ningfei/u3d Windows x64 Shared Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取ningfei/u3d源码
        uses: actions/checkout@v4

      - name: 配置MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 修复u3d的CMake最低版本（解决旧版本警告）
        run: |
          (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(VERSION 2\.8\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt

      - name: 使用vcpkg自动安装依赖 zlib libpng
        run: |
          vcpkg install zlib:x64-windows libpng:x64-windows
          vcpkg integrate install

      - name: CMake配置u3d（x64 共享库 Release 静态CRT，自动使用vcpkg依赖）
        run: |
          mkdir build
          cd build
          cmake .. -A x64 `
            -DU3D_SHARED=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
            -DCMAKE_TOOLCHAIN_FILE="C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: 编译u3d
        run: |
          cd build
          cmake --build . --config Release

      - name: 整理打包文件
        run: |
          mkdir artifact
          copy build\Release\IDTFConverter.exe artifact\IDTFConverter_x64.exe
          copy build\Release\u3d.dll artifact\u3d.dll
          copy C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\vcpkg\installed\x64-windows\bin\zlib1.dll artifact\zlib1.dll
          copy C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\vcpkg\installed\x64-windows\bin\libpng16.dll artifact\libpng16.dll

      - name: 上传成品包
        uses: actions/upload-artifact@v4
        with:
          name: u3d-x64-shared-release
          path: artifact/
