name: Build ningfei/u3d Windows x64 Shared Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: vcpkg 安装依赖 zlib libpng
        uses: microsoft/vcpkg@v1
        with:
          triplet: x64-windows
          packages: zlib libpng

      - name: 加载MSVC编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 修复CMakeLists版本顺序问题（cmake_minimum_required放到最顶部）
        run: |
          $txt = Get-Content CMakeLists.txt -Raw
          $txt = $txt -replace 'project\(u3d\)', "cmake_minimum_required(VERSION 3.10)`nproject(u3d)"
          Set-Content CMakeLists.txt $txt

      - name: CMake配置
        run: |
          mkdir build
          cd build
          cmake .. -A x64 `
            -DU3D_SHARED=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-toolchain-file }}"

      - name: 编译
        run: |
          cd build
          cmake --build . --config Release

      - name: 收集产物
        run: |
          mkdir artifact
          copy build\Release\IDTFConverter.exe artifact\IDTFConverter_x64.exe
          copy build\Release\u3d.dll artifact\u3d.dll
          copy ${{ steps.vcpkg.outputs.vcpkg-root }}\installed\x64-windows\bin\zlib1.dll artifact\zlib1.dll
          copy ${{ steps.vcpkg.outputs.vcpkg-root }}\installed\x64-windows\bin\libpng16.dll artifact\libpng16.dll

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: u3d-x64-release
          path: artifact/
